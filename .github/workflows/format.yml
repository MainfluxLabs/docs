name: Format

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Markdown formatting
        run: npx --yes prettier@3.7.4 --check "**/*.md"
